<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">
    <h1>My ToDo List</h1>
    </div>
    <div class="container">
    <form id ="form">
        <label for="newTask">Enter your tasks</label>
        <input type="text" id="newTask" placeholder="e.g., learn JavaScript">
        <button type="submit" id="button">Add Task</button>
    </form>
    </div>
    <div class ="task-list">
        <ul id="todo-list"></ul>
    </div>
</body>
<script src="script.js"></script>
</html>
